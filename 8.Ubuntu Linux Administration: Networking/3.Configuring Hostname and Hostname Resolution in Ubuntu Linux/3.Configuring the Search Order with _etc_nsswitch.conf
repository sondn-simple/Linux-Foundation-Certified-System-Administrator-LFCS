╔══════════════════════════════════════════════════════════════════════════════╗
║      CONFIGURING THE SEARCH ORDER WITH /ETC/NSSWITCH.CONF                    ║
║   (Thực Hành: Cấu Hình Thứ Tự Tra Cứu Tên Với nsswitch.conf)                 ║
╚══════════════════════════════════════════════════════════════════════════════╝


TỔNG QUAN BÀI HỌC
────────────────────────────────────────────────────────────────

  Chủ đề     : Cấu hình thứ tự phân giải tên (name resolution
               order) và vấn đề bảo mật liên quan
  Hệ thống   : ubuntu1
  Mục tiêu   : Hiểu vì sao nên ưu tiên DNS trước localhost file, và
               cách khắc phục vấn đề đặc thù của Ubuntu

VẤN ĐỀ BẢO MẬT VỚI THỨ TỰ MẶC ĐỊNH
────────────────────────────────────────────────────────────────

  • Hầu hết distro Linux MẶC ĐỊNH kiểm tra FILE LOCALHOST
    (/etc/hosts) TRƯỚC KHI kiểm tra DNS

  • Lý do (nghe có vẻ hợp lý): file local không cần TRUY VẤN dịch
    vụ bên ngoài

  • VẤN ĐỀ BẢO MẬT:
      - File LOCAL DỄ BỊ THAO TÚNG (manipulate) hơn NHIỀU so với hệ
        thống DNS phía sau
      - Nếu kẻ tấn công CHIẾM ĐƯỢC quyền sửa file /etc/hosts, họ có
        thể ĐIỀU HƯỚNG người dùng đến địa chỉ SAI

GIẢI PHÁP: THAY ĐỔI THỨ TỰ TRA CỨU
────────────────────────────────────────────────────────────────

  • Thứ tự tra cứu được cấu hình tại: /etc/nsswitch.conf
      - Không chỉ có database "hosts", còn có nhiều database khác
        (vd: "passwd" cho user database)

  • VẤN ĐỀ ĐẶC THÙ TRÊN UBUNTU:
      - Ubuntu chạy DNS SERVER LOCAL RIÊNG
      - DNS server local này ĐƯỢC CẤU HÌNH để ĐỌC file /etc/hosts
      - → Dù đổi thứ tự ưu tiên DNS trước, VẪN GẶP VẤN ĐỀ vì DNS
        local vẫn đọc lại /etc/hosts

THỬ NGHIỆM: KIỂM TRA HÀNH VI MẶC ĐỊNH
────────────────────────────────────────────────────────────────

  • Truy vấn database host (không tham số → chỉ xem localhost
    entries):
      getent hosts

      → Chỉ hiển thị các entry TRONG /etc/hosts (không phải toàn bộ
        internet)

  • Truy vấn 1 host cụ thể trên internet:
      getent hosts www.ibm.com

      → Trả về kết quả phân giải THỰC TẾ từ DNS (hành vi mặc định
        đúng, VÌ chưa có entry trùng trong /etc/hosts)

MINH HỌA LỖ HỔNG: THÊM ENTRY GIẢ VÀO /ETC/HOSTS
────────────────────────────────────────────────────────────────

  • Chỉnh sửa file hosts:
      sudo vim /etc/hosts

  • Thêm dòng GIẢ MẠO:
      127.0.2.2   www.ibm.com   ibm

      - Định dạng: IP address, tên miền ĐẦY ĐỦ (FQDN), rồi các
        ALIAS (tên gọi khác, tùy chọn)
      - Dùng dải 127.x.x.x để trỏ về CHÍNH HỆ THỐNG LOCAL

  • Kiểm tra lại:
      getent hosts ibm.com

      → LẦN NÀY: trả về ĐỊA CHỈ GIẢ (local) thay vì địa chỉ IBM
        THẬT
      → CHỨNG MINH LỖ HỔNG: file local DỄ BỊ LỢI DỤNG để ĐIỀU HƯỚNG
        SAI địa chỉ

THAY ĐỔI THỨ TỰ TRA CỨU TRONG NSSWITCH.CONF
────────────────────────────────────────────────────────────────

  • Chỉnh sửa file:
      sudo vim /etc/nsswitch.conf

  • Tìm dòng "hosts", mặc định là:
      hosts: files dns

      - files : kiểm tra /etc/hosts TRƯỚC
      - dns    : kiểm tra DNS SAU

  • Đổi thành:
      hosts: dns files

      - Giờ DNS được kiểm tra TRƯỚC, files SAU

  • Lưu file lại

  • KIỂM TRA LẠI - VẪN CHƯA GIẢI QUYẾT ĐƯỢC VẤN ĐỀ:
      getent hosts ibm.com

      → VẪN trả về địa chỉ GIẢ (local)
      → NGUYÊN NHÂN: DNS SERVER LOCAL của Ubuntu VẪN ĐANG ĐỌC file
        /etc/hosts, nên dù ưu tiên "dns" trước, kết quả DNS local
        đó VẪN LẤY TỪ /etc/hosts

KHẮC PHỤC TRIỆT ĐỂ: CẤU HÌNH SYSTEMD-RESOLVED
────────────────────────────────────────────────────────────────

  • Chỉnh sửa file cấu hình của resolved daemon:
      sudo vim /etc/systemd/resolved.conf

  • Tìm dòng (thường ĐANG BỊ COMMENT với giá trị mặc định hiển thị):
      #ReadEtcHosts=yes

  • BỎ COMMENT và ĐỔI GIÁ TRỊ:
      ReadEtcHosts=no

      - Ý NGHĨA: NGĂN DNS server LOCAL đọc file /etc/hosts
      - Đây CHÍNH LÀ điều ta MUỐN: KHÔNG để localhost entry ẢNH
        HƯỞNG đến kết quả DNS

  • Lưu file, sau đó khởi động lại dịch vụ để ÁP DỤNG thay đổi:
      sudo systemctl restart systemd-resolved

KIỂM TRA LẠI SAU KHI KHẮC PHỤC HOÀN TOÀN
────────────────────────────────────────────────────────────────

  • Chạy lại truy vấn:
      getent hosts ibm.com

      → LẦN NÀY: TRẢ VỀ ĐÚNG địa chỉ IBM THỰC (từ DNS), KHÔNG còn
        bị entry giả trong /etc/hosts CHI PHỐI

  • LƯU Ý: KHÔNG MẤT chức năng của /etc/hosts hoàn toàn
      - Nếu tên miền KHÔNG TÌM THẤY trong DNS, hệ thống VẪN SẼ tra
        cứu /etc/hosts (vì "files" vẫn còn trong danh sách, chỉ là
        đứng SAU "dns")
      - Chỉ đảm bảo: nếu ĐÓ LÀ HOST INTERNET THẬT, DNS sẽ được ưu
        tiên kiểm tra TRƯỚC

KẾT LUẬN
────────────────────────────────────────────────────────────────

  Qua bài thực hành, ta đã:
    - Hiểu RỦI RO BẢO MẬT khi hệ thống ưu tiên đọc /etc/hosts TRƯỚC
      DNS (dễ bị THAO TÚNG/tấn công)
    - Thay đổi thứ tự tra cứu trong /etc/nsswitch.conf (dns trước
      files)
    - PHÁT HIỆN vấn đề ĐẶC THÙ trên Ubuntu: DNS server local VẪN
      đọc /etc/hosts, làm thay đổi thứ tự KHÔNG CÓ TÁC DỤNG
    - KHẮC PHỤC TRIỆT ĐỂ bằng cách đặt ReadEtcHosts=no trong
      /etc/systemd/resolved.conf và restart dịch vụ
      systemd-resolved

  Đây là bài học QUAN TRỌNG về BẢO MẬT DNS: luôn ưu tiên tra cứu từ
  nguồn ĐÁNG TIN CẬY và KHÓ BỊ THAO TÚNG (DNS server) trước nguồn
  DỄ BỊ CHỈNH SỬA CỤC BỘ (local file).


